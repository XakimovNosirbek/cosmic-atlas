# Build the viewer (web/) and publish it to Cloudflare Pages (project cosmic-atlas, https://cosmic.bristleconelab.org).
#
# Tiles are NOT built here (the raw data is ~7 GB and the fetches take hours). Two ways to give
# the published site its tiles, see docs/deploy.md:
#   - repo variable TILE_BASE      = absolute URL of an external tile origin, baked in as VITE_TILE_BASE
#   - repo variable LITE_TILES_URL = URL of a .tar.gz of a lite tile set made by
#                                    scripts/make_lite_tiles.py (e.g. a release asset); it is
#                                    unpacked into the site as tiles/
# Neither set: the app is published alone and looks for tiles/ next to it.
#
# Cloudflare Pages takes at most 20,000 files of at most 25 MiB each: scripts/split_large_tiles.py cuts the few bigger
# tile files (the main-belt asteroid orbits, about 44 MB) into parts the viewer joins again.
# Needs the secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit; the bristleconelab organization secret)
# and the repo variable PAGES_ENABLED=true so pushes deploy. Manual runs (workflow_dispatch) always run.
name: Deploy

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/tiles/catalogs/**', 'scripts/split_large_tiles.py', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build (tile origin from vars.TILE_BASE, default tiles/)
        env:
          VITE_TILE_BASE: ${{ vars.TILE_BASE }}
        run: |
          echo "VITE_TILE_BASE='${VITE_TILE_BASE:-tiles/ (default)}'"
          npm run build

      - name: Add lite tiles (vars.LITE_TILES_URL)
        if: vars.LITE_TILES_URL != ''
        env:
          LITE_TILES_URL: ${{ vars.LITE_TILES_URL }}
          TILE_BASE: ${{ vars.TILE_BASE }}
        run: |
          if [ -n "$TILE_BASE" ]; then
            echo "::warning::TILE_BASE is set, so the app will not read the bundled tiles/"
          fi
          mkdir -p dist/tiles
          curl -fsSL --retry 3 "$LITE_TILES_URL" -o "$RUNNER_TEMP/lite.tar.gz"
          tar -xzf "$RUNNER_TEMP/lite.tar.gz" -C dist/tiles --no-same-owner
          test -f dist/tiles/_index.json || { echo "::error::archive has no _index.json at its root"; exit 1; }

      - name: Overlay the catalogues committed in this repo
        # the small named-object catalogues live in git (data/tiles/catalogs), so a catalogue change
        # does not need a new tile archive; also run when neither LITE_TILES_URL nor TILE_BASE is set
        if: vars.LITE_TILES_URL != '' || vars.TILE_BASE == ''
        run: |
          mkdir -p dist/tiles/catalogs
          cp -R ../data/tiles/catalogs/. dist/tiles/catalogs/
          rm -f dist/tiles/catalogs/dev-placeholder.json
          python3 ../scripts/write_tiles_index.py dist/tiles
          cat dist/tiles/_index.json

      - name: Split tile files over the Cloudflare Pages 25 MiB limit
        run: python3 ../scripts/split_large_tiles.py dist/tiles

      - name: Check the Cloudflare Pages limits (20,000 files, 25 MiB each)
        run: |
          n=$(find dist -type f | wc -l); echo "site: $(du -sh dist | cut -f1), $n files"
          [ "$n" -le 20000 ] || { echo "::error::$n files, Cloudflare Pages allows 20,000"; exit 1; }
          big=$(find dist -type f -size +24M)
          [ -z "$big" ] || { echo "::error::files over 24 MiB: $big"; exit 1; }

      # wrangler runs from an empty directory: run in web/ it rewrites package.json and vite.config.ts
      # (deploy/cloudflare_pages.sh, same pitfall)
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 95c89337261f10f37ac1310191b2ebb7
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN not set: the site was NOT deployed"; exit 1; fi
          printf '/tiles/*\n  Cache-Control: public, max-age=86400\n/assets/*\n  Cache-Control: public, max-age=31536000, immutable\n' > dist/_headers
          site="$PWD/dist"; msg="$(git log -1 --format=%s | head -c 200)"
          mkdir -p "$RUNNER_TEMP/cf" && cd "$RUNNER_TEMP/cf"
          npx --yes wrangler@4.164.0 pages deploy "$site" --project-name cosmic-atlas --branch main --commit-hash "$GITHUB_SHA" --commit-message "$msg"
